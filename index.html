<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>彩蛋页面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#0078d4;
    color:#ffffff;
    font-family:"Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:40px;
}
h1{
    font-size:48px;
    margin-bottom:30px;
    opacity:0;
    animation: fadeIn 1s ease forwards;
}
p{
    font-size:24px;
    margin-bottom:16px;
    max-width:800px;
    opacity:0;
    animation: fadeIn 1s ease forwards;
}
.p1{animation-delay:1s;}
.p2{animation-delay:2s;}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>
    <h1>:) CPU没有爆炸！</h1>
    <p class="p1">恭喜你找到彩蛋！</p>
    <p class="p2">刚刚的蓝屏只是恶搞程序，你的电脑一切正常。</p>
</body>
</html>
