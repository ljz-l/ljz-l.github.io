<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>媒体播放器</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
    background: #b8d8f0;
    color:#111;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px;
}
.title{
    font-size:24px;
    font-weight:500;
    margin-bottom:24px;
    color:#18181b;
}
#fileInput{
    display:none;
}
.select-btn{
    padding:10px 24px;
    background:#27272a;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s ease;
    margin-bottom:28px;
}
.select-btn:hover{
    background:#3f3f46;
}
.player-container{
    position:relative;
    width:min(94%, 1140px);
    border-radius:14px;
    overflow:hidden;
    background:#000000;
    box-shadow:0 8px 32px rgba(0,0,0,0.45);
}

.media-screen{
    min-height:440px;
    aspect-ratio: 16 / 9;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000000;
    overflow:hidden;
}

img{
    max-width:100%;
    max-height:84vh;
    display:block;
}

video{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display:block;
}

.control-panel{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    background:linear-gradient(to top,#000000cc,transparent);
    padding:22px 26px;
    opacity:0;
    transition:opacity 0.3s ease;
}
.control-panel.show{
    opacity:1;
}
.progress-bar{
    width:100%;
    height:5px;
    background:#333338;
    border-radius:999px;
    cursor:pointer;
    margin-bottom:14px;
    position:relative;
}
.progress-fill{
    height:100%;
    width:0%;
    background:#6366f1;
    border-radius:999px;
}
.progress-thumb{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#6366f1;
    box-shadow:0 0 6px #6366f190;
    position:absolute;
    top:50%;
    transform:translate(-50%, -50%);
    left:0%;
    pointer-events:none;
    transition:transform 0.15s ease;
}
.progress-bar:hover .progress-thumb{
    transform:translate(-50%, -50%) scale(1.3);
}
.control-row{
    display:flex;
    align-items:center;
    gap:16px;
}
.control-row button{
    border:none;
    background:transparent;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    padding:4px 7px;
    border-radius:6px;
    transition:background 0.2s;
}
.control-row button:hover{
    background:rgba(255,255,255,0.1);
}
.time-text{
    font-size:14px;
    color:#cccccc;
}
.volume-wrap{
    display:flex;
    align-items:center;
    gap:6px;
}
#volume{
    width:82px;
}
.speed-select{
    background:#27272a;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:4px 6px;
    outline:none;
}
.speed-select:hover{
    background:#3f3f46;
}
</style>
</head>
<body>
    <div class="title">本地媒体播放器</div>
    <div class="title"> ljz™版权所有</div>
    <label class="select-btn" for="fileInput">📂 选择媒体文件</label>
    <input type="file" id="fileInput" accept="image/*,video/mp4,audio/mpeg">

<div class="player-container" id="playerWrap">
    <div class="media-screen" id="mediaView"></div>
    <div class="control-panel" id="controlsWrap">
        <div class="progress-bar" id="progress">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="control-row">
            <button id="playBtn">▶</button>
            <span class="time-text"><span id="current">00:00</span> / <span id="duration">00:00</span></span>
            <div class="volume-wrap">
                <button id="volBtn">🔊</button>
                <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
            </div>
            <select class="speed-select" id="speedSelect">
                <option value="1" selected>1x</option>
        <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="3">3x</option>
    <option value="4">4x</option>
    <option value="5">5x</option>
    <option value="8">8x</option>
    <option value="10">10x</option>
    <option value="16">16x</option>
</select>

            </select>
            <button id="fullBtn">⛶</button>
        </div>
    </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const mediaView = document.getElementById('mediaView');
const controlsWrap = document.getElementById('controlsWrap');
const playBtn = document.getElementById('playBtn');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const currentTimeEl = document.getElementById('current');
const durationEl = document.getElementById('duration');
const volBtn = document.getElementById('volBtn');
const volumeInput = document.getElementById('volume');
const speedSelect = document.getElementById('speedSelect');
const fullBtn = document.getElementById('fullBtn');
const wrapper = document.getElementById('playerWrap');

let media;
let isDragging = false;
let hideTimer = null;
let currentFileName = "";

function formatTime(s){
    if(isNaN(s)) return "00:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2,'0') + ":" + String(sec).padStart(2,'0');
}
function updateProgressUI(percent){
    progressFill.style.width = percent + '%';
    progressThumb.style.left = percent + '%';
}

function showControls(){
    controlsWrap.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{
        if(media && !media.paused){
            controlsWrap.classList.remove('show');
        }
    },3000);
}
wrapper.addEventListener('mousemove', showControls);
wrapper.addEventListener('mouseleave',()=>{
    clearTimeout(hideTimer);
    controlsWrap.classList.remove('show');
})

fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    mediaView.innerHTML = '';
    currentFileName = file.name;

    if(file.type.startsWith('image/')){
        controlsWrap.style.display = 'none';
        const img = document.createElement('img');
        img.src = url;
        mediaView.appendChild(img);
        media = null;
        return;
    }

    controlsWrap.style.display = 'block';
    if(file.type === 'video/mp4') media = document.createElement('video');
    else if(file.type === 'audio/mpeg') media = document.createElement('audio');
    media.src = url;
    mediaView.appendChild(media);

    const savedPos = localStorage.getItem('mediaPos_' + currentFileName);
    media.addEventListener('loadedmetadata', ()=>{
        durationEl.textContent = formatTime(media.duration);
        if(savedPos) media.currentTime = parseFloat(savedPos);
        media.play();
        playBtn.textContent = "⏸";
    })

    media.addEventListener('timeupdate',()=>{
        if(isDragging) return;
        const pct = (media.currentTime / media.duration) * 100;
        updateProgressUI(pct);
        currentTimeEl.textContent = formatTime(media.currentTime);
        localStorage.setItem('mediaPos_' + currentFileName, media.currentTime);
    })
    media.addEventListener('ended',()=>{
        playBtn.textContent = "▶";
    })
}

playBtn.onclick = ()=>{
    if(!media) return;
    if(media.paused){
        media.play();
        playBtn.textContent = "⏸";
    }else{
        media.pause();
        playBtn.textContent = "▶";
    }
}

progress.addEventListener('mousedown', (e)=>{
    if(!media) return;
    isDragging = true;
    setProgressByMouse(e);
});
document.addEventListener('mousemove', (e)=>{
    if(!isDragging || !media) return;
    setProgressByMouse(e);
});
document.addEventListener('mouseup', ()=> isDragging = false);
function setProgressByMouse(e){
    const rect = progress.getBoundingClientRect();
    let pos = (e.clientX - rect.left) / rect.width;
    pos = Math.max(0, Math.min(1, pos));
    const percent = pos * 100;
    updateProgressUI(percent);
    media.currentTime = pos * media.duration;
}

volumeInput.oninput = ()=>{
    if(!media) return;
    media.volume = volumeInput.value;
    volBtn.textContent = media.volume === 0 ? "🔇" : "🔊";
}
volBtn.onclick = ()=>{
    if(!media) return;
    media.muted = !media.muted;
    volBtn.textContent = media.muted ? "🔇" : "🔊";
}
speedSelect.onchange = ()=>{
    if(!media) return;
    media.playbackRate = speedSelect.value;
}
fullBtn.onclick = ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else wrapper.requestFullscreen();
}

document.addEventListener('keydown',(e)=>{
    if(!media) return;
    switch(e.code){
        case 'Space':
            e.preventDefault();playBtn.click();break;
        case 'ArrowLeft':media.currentTime -=5;break;
        case 'ArrowRight':media.currentTime +=5;break;
        case 'KeyM':volBtn.click();break;
    }
})
</script>
</body>
</html>
